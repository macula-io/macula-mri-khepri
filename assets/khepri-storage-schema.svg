<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="khepriGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#059669"/>
      <stop offset="100%" style="stop-color:#10b981"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="#f8fafc"/>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">Khepri Storage Schema</text>
  <text x="400" y="50" text-anchor="middle" font-size="11" fill="#64748b">macula_mri_khepri - Tree paths and indexes</text>

  <!-- MRI Tree -->
  <g transform="translate(30, 70)">
    <rect width="350" height="180" rx="8" fill="url(#khepriGrad)" filter="url(#shadow)"/>
    <text x="175" y="25" text-anchor="middle" font-size="13" font-weight="bold" fill="white">MRI Tree Storage</text>

    <rect x="15" y="40" width="320" height="125" rx="6" fill="white" fill-opacity="0.95"/>
    <text x="25" y="60" font-size="10" font-weight="600" fill="#047857">Path Structure:</text>
    <text x="25" y="78" font-size="9" font-family="monospace" fill="#065f46">[mri, Type, Realm, Seg1, Seg2, ...]</text>

    <text x="25" y="100" font-size="10" font-weight="600" fill="#047857">Example:</text>
    <text x="25" y="115" font-size="8" fill="#64748b">mri:app:io.macula/acme/counter</text>
    <text x="25" y="130" font-size="8" font-family="monospace" fill="#065f46">[mri, app, &lt;&lt;"io.macula"&gt;&gt;, &lt;&lt;"acme"&gt;&gt;, &lt;&lt;"counter"&gt;&gt;]</text>

    <text x="25" y="152" font-size="10" font-weight="600" fill="#047857">Value:</text>
    <text x="25" y="165" font-size="8" font-family="monospace" fill="#065f46">#{mri =&gt; MRI, registered_at =&gt; Ts, ...metadata}</text>
  </g>

  <!-- Relationship Storage -->
  <g transform="translate(420, 70)">
    <rect width="350" height="180" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1" filter="url(#shadow)"/>
    <text x="175" y="25" text-anchor="middle" font-size="13" font-weight="bold" fill="#dc2626">Relationship Storage</text>

    <rect x="15" y="40" width="320" height="125" rx="6" fill="white" fill-opacity="0.95"/>
    <text x="25" y="60" font-size="10" font-weight="600" fill="#b91c1c">Forward Index (subject → object):</text>
    <text x="25" y="78" font-size="8" font-family="monospace" fill="#991b1b">[mri_rel, forward, Subject, Pred, Object]</text>

    <text x="25" y="100" font-size="10" font-weight="600" fill="#b91c1c">Reverse Index (object → subject):</text>
    <text x="25" y="118" font-size="8" font-family="monospace" fill="#991b1b">[mri_rel, reverse, Object, Pred, Subject]</text>

    <text x="25" y="145" font-size="10" font-weight="600" fill="#b91c1c">Value:</text>
    <text x="25" y="160" font-size="8" font-family="monospace" fill="#991b1b">#{subject, predicate, object, created_at, ...}</text>
  </g>

  <!-- Secondary Indexes -->
  <g transform="translate(30, 270)">
    <rect width="350" height="130" rx="8" fill="#faf5ff" stroke="#a855f7" stroke-width="1" filter="url(#shadow)"/>
    <text x="175" y="25" text-anchor="middle" font-size="13" font-weight="bold" fill="#7e22ce">Secondary Indexes</text>

    <rect x="15" y="40" width="320" height="75" rx="6" fill="white" fill-opacity="0.95"/>
    <text x="25" y="60" font-size="10" font-weight="600" fill="#6b21a8">Type Index:</text>
    <text x="25" y="75" font-size="8" font-family="monospace" fill="#7c3aed">[mri_index, by_type, Type, Realm, MRI] =&gt; true</text>

    <text x="25" y="95" font-size="10" font-weight="600" fill="#6b21a8">Realm Index:</text>
    <text x="25" y="110" font-size="8" font-family="monospace" fill="#7c3aed">[mri_index, by_realm, Realm, MRI] =&gt; true</text>
  </g>

  <!-- Query Patterns -->
  <g transform="translate(420, 270)">
    <rect width="350" height="130" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1" filter="url(#shadow)"/>
    <text x="175" y="25" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">Query Patterns</text>

    <rect x="15" y="40" width="320" height="75" rx="6" fill="white" fill-opacity="0.95"/>
    <text x="25" y="58" font-size="9" fill="#1e40af">Children: <tspan font-family="monospace" fill="#3b82f6">Path ++ [#if_name_matches{}]</tspan></text>
    <text x="25" y="75" font-size="9" fill="#1e40af">Descendants: <tspan font-family="monospace" fill="#3b82f6">Path ++ [#if_path_matches{}]</tspan></text>
    <text x="25" y="92" font-size="9" fill="#1e40af">By type: <tspan font-family="monospace" fill="#3b82f6">[mri_index, by_type, T, R, ...]</tspan></text>
    <text x="25" y="109" font-size="9" fill="#1e40af">Related: <tspan font-family="monospace" fill="#3b82f6">[mri_rel, forward, S, P, ...]</tspan></text>
  </g>

  <!-- Khepri Features -->
  <g transform="translate(30, 420)">
    <rect width="740" height="65" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1" filter="url(#shadow)"/>
    <text x="370" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#166534">Khepri + Ra Features Used</text>

    <g transform="translate(30, 35)">
      <text font-size="10" font-weight="600" fill="#166534">Tree Storage</text>
      <text y="13" font-size="8" fill="#15803d">Hierarchical paths</text>
    </g>
    <g transform="translate(150, 35)">
      <text font-size="10" font-weight="600" fill="#166534">Pattern Matching</text>
      <text y="13" font-size="8" fill="#15803d">#if_name_matches{}</text>
    </g>
    <g transform="translate(290, 35)">
      <text font-size="10" font-weight="600" fill="#166534">Transactions</text>
      <text y="13" font-size="8" fill="#15803d">khepri:transaction/2</text>
    </g>
    <g transform="translate(420, 35)">
      <text font-size="10" font-weight="600" fill="#166534">Raft Consensus</text>
      <text y="13" font-size="8" fill="#15803d">Distributed consistency</text>
    </g>
    <g transform="translate(560, 35)">
      <text font-size="10" font-weight="600" fill="#166534">Persistence</text>
      <text y="13" font-size="8" fill="#15803d">Crash recovery</text>
    </g>
    <g transform="translate(680, 35)">
      <text font-size="10" font-weight="600" fill="#166534">Bulk Ops</text>
      <text y="13" font-size="8" fill="#15803d">get_many/2</text>
    </g>
  </g>
</svg>
